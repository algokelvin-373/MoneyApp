name: Privacy Policy Pages

on:
  push:
    branches:
      - master
      - staging
      - dev/improvements
    paths:
      - 'moneylife_app_android/docs/privacy-policy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-policy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moneylife_app_android/docs/privacy-policy
      - id: deployment
        uses: actions/deploy-pages@v4
