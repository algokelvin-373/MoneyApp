name: Android CI

on:
  push:
    paths:
      - 'moneylife_app_android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'moneylife_app_android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: moneylife_app_android
    env:
      # Optional signing material. When these repository secrets are absent the
      # release bundle is still built and verified unsigned by R8.
      MONEYLIFE_KEYSTORE_BASE64: ${{ secrets.MONEYLIFE_KEYSTORE_BASE64 }}
      MONEYLIFE_STORE_PASSWORD: ${{ secrets.MONEYLIFE_STORE_PASSWORD }}
      MONEYLIFE_KEY_ALIAS: ${{ secrets.MONEYLIFE_KEY_ALIAS }}
      MONEYLIFE_KEY_PASSWORD: ${{ secrets.MONEYLIFE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure release signing (optional)
        if: env.MONEYLIFE_KEYSTORE_BASE64 != ''
        run: |
          keystore_path="$RUNNER_TEMP/moneylife-release.keystore"
          printf '%s' "$MONEYLIFE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          properties_path="$RUNNER_TEMP/moneylife-signing.properties"
          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$MONEYLIFE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$MONEYLIFE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$MONEYLIFE_KEY_PASSWORD"
          } > "$properties_path"
          chmod 600 "$keystore_path" "$properties_path"
          echo "MONEYLIFE_SIGNING_PROPERTIES=$properties_path" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Kotlin formatting
        run: ./gradlew :app:ktlintCheck
      - name: Android lint (debug)
        run: ./gradlew :app:lintDebug
      - name: Android lint (release)
        run: ./gradlew :app:lintRelease
      - name: Build instrumentation test APK
        run: ./gradlew :app:assembleDebugAndroidTest
      - name: Build release bundle
        run: ./gradlew :app:bundleRelease
      - name: Build staging bundle
        run: ./gradlew :app:bundleStaging
      - name: Build staging APK
        run: ./gradlew :app:assembleStaging
      - name: Verify signed release bundle
        if: env.MONEYLIFE_SIGNING_PROPERTIES != ''
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Record release bundle checksum
        run: |
          sha256sum app/build/outputs/bundle/release/app-release.aab | tee release-aab.sha256
          {
            echo '## Release AAB'
            echo '```'
            cat release-aab.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: moneylife-release-aab
          path: |
            moneylife_app_android/app/build/outputs/bundle/release/*.aab
            moneylife_app_android/release-aab.sha256
          if-no-files-found: error

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: moneylife-staging-apk
          path: moneylife_app_android/app/build/outputs/apk/staging/*.apk
          if-no-files-found: error

      - name: Upload lint and unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneylife-build-reports
          path: |
            moneylife_app_android/app/build/reports/lint-results-debug.html
            moneylife_app_android/app/build/reports/lint-results-release.html
            moneylife_app_android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 27 does not publish a google_apis x86_64 system image.
          - api-level: 27
            target: default
          - api-level: 36
            target: google_apis
    defaults:
      run:
        working-directory: moneylife_app_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          working-directory: moneylife_app_android
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneylife-instrumentation-api-${{ matrix.api-level }}
          path: |
            moneylife_app_android/app/build/reports/androidTests/connected/**
            moneylife_app_android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
